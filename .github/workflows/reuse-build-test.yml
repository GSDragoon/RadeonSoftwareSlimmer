name: Build and Test

on:
  workflow_call:
    inputs:
      build-version:
        description: 'The version to build'
        default: 1.0.0
        required: true
        type: string

jobs:
  buildTestPublish:
    name: Build Test Publish
    runs-on: windows-latest
    env:
      BUILD_VERSION: ${{ inputs.build-version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: true
      DOTNET_NOLOGO: true

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build
      run: ./build/build.ps1

    - name: Test
      run: ./build/test.ps1

    # https://github.com/marketplace/actions/test-reporter
    - name: Publish Test Results
      if: ${{ !cancelled() }}
      uses: dorny/test-reporter@v3
      with:
        name: Test Results
        report-title: Test Results
        path: ./artifacts/tests/*.trx
        reporter: dotnet-trx
        only-summary: false
        fail-on-error: true
        fail-on-empty: true

    - name: Publish Coverage Summary
      if: ${{ !cancelled() }}
      run: Get-Content ./artifacts/CoverageReports/MarkdownSummaryGithub/SummaryGithub.md | Add-Content $Env:GITHUB_STEP_SUMMARY
    - name: Publish
      run: ./build/publish.ps1

    - name: Upload Published Artifact
      uses: actions/upload-artifact@v7
      with:
        name: published-artifact
        path: ./artifacts/publish/RadeonSoftwareSlimmer_*_net*.zip
        if-no-files-found: error
        compression-level: 0
